<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WHOOP Authorization — Workout Intelligence</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 640px; margin: 0 auto; padding: 48px 24px; line-height: 1.6; color: #1d1d1f; }
  code { display: block; word-break: break-all; background: #f5f5f7; padding: 12px; border-radius: 8px; margin: 8px 0; }
  .err { color: #c0392b; }
  button { padding: 8px 16px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>WHOOP authorization</h1>
<div id="out">Processing…</div>
<script>
  const p = new URLSearchParams(window.location.search);
  const out = document.getElementById('out');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if (p.get('error')) {
    out.innerHTML = '<p class="err">Authorization failed: ' + esc(p.get('error')) + '</p>' +
      (p.get('error_description') ? '<p>' + esc(p.get('error_description')) + '</p>' : '');
  } else if (p.get('code')) {
    out.innerHTML = '<p>Authorization successful. Copy this code back into the app to finish connecting:</p>' +
      '<code id="c">' + esc(p.get('code')) + '</code>' +
      (p.get('state') ? '<p>State: <code>' + esc(p.get('state')) + '</code></p>' : '') +
      '<button onclick="navigator.clipboard.writeText(document.getElementById(\'c\').textContent)">Copy code</button>';
  } else {
    out.innerHTML = '<p>This is the OAuth redirect page for Workout Intelligence. No authorization code was received.</p>';
  }
</script>
</body>
</html>
